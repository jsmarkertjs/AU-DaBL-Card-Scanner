# AU Card Reader configuration
#
# Copy this file to config.yaml and fill in the Canvas values.
# NEVER commit config.yaml - it holds (or points at) your Canvas token.

canvas:
  base_url: "https://au.instructure.com"
  # Leave blank and set the AU_CANVAS_TOKEN env var instead (preferred on the Pi).
  token: ""
  course_id: 0
  assignment_id: 0
  # Green when the submission is graded: graded_at set, OR workflow_state
  # in this list.
  completed_states: ["graded"]
  request_timeout_seconds: 10.0

mapping:
  # roster = fetch the course roster once and match AUID/zero-padded variants
  #          against each user's sis_user_id / login_id (recommended).
  # sis    = look up /users/sis_user_id:<auid> per swipe (may need admin).
  # csv    = use auid_to_canvas_id.csv (columns: auid,canvas_user_id).
  mode: "roster"
  csv_path: "auid_to_canvas_id.csv"
  # How long to cache the fetched roster, in seconds.
  roster_cache_ttl_seconds: 600.0

parsing:
  # Confirmed samples (raw -> AUID), suffix varies between cards:
  #   ";00555036321?" -> 5550363
  #   ";00539046522?" -> 5390465
  # Patterns are tried first; adjust if other cards encode differently.
  patterns:
    - '^;00(?P<auid>\d{7})\d{2}\?$'
  # Fallback when no pattern matches: take the longest digit run and drop this
  # many leading/trailing digits. "00555036321" -2/-2 -> "5550363".
  trim_prefix: 2
  trim_suffix: 2
  # Extra widths to try when resolving the AUID in Canvas (e.g. 5550363 -> 05550363).
  auid_candidate_widths: [7, 8]

input:
  # evdev on the Pi, stdin on a dev machine.
  source: "evdev"
  device_name_regex: "(?i)(reader|hid|card|magtek|symbol)"

indicator:
  # console now; gpio once the lights are wired.
  driver: "console"
  gpio:
    red: 17
    yellow: 27
    green: 22
    active_high: true

behavior:
  debounce_seconds: 3.0
  cache_ttl_seconds: 60.0
  clear_after_seconds: 8.0
